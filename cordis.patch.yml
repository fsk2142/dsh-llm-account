# dsh-llm-account 的 bundle 层：一个包装一次、插两行（设计 §5.1）。
#
# 行 id 与旧插件**完全一致**（`llm-commandcode` / `opencode-go`），所以用户 profile patch 里
# 按 id 覆盖（`config:` 那些字段）继续生效，账号与白名单零迁移。同一行 id 只能由一个层插入，
# 因此本包与两个旧插件互斥：切换必须是「卸旧装新」（设计 §5.3）。
#
# `name` 的写法受宿主 `client-modules` 的启动图扫描规则约束（2026-10-17 实测，
# 2026-10-28 按宿主源码 `dsh-client-modules/lib/index.js` 复核并改写）：
#
# 扫描链是 `resolveMeta` → `locatePkgJson`，两条出口决定「这一行产不产客户端 source」：
#
# ```js
# locatePkgJson(name, base) {
#   const pathLike = name.startsWith(".") || name.startsWith("file:") || isAbsolute(name);
#   const expected = pathLike ? undefined : exactPackageSpecifier(name);
#   if (!pathLike && expected === undefined) return undefined;   // ← 出口：不产 source
#   ...
# }
# // exactPackageSpecifier：不含 "/" 也不含 ":" 才算包根 —— 子路径一律 undefined
# ```
#
# - **子路径说明符**（`dsh-llm-account/commandcode`）：加载器能挂载（走 Node `exports`），
#   但含 `/` → `exactPackageSpecifier` 返回 undefined → 这一行**不产生客户端 source**。
#   不报错，`./client` bundle 只是不进浏览器启动图。
# - **裸包名**（`dsh-llm-account`）：不含 `/` → 识别为包根 → 按包名解析 `package.json`
#   → 命中本包 → **产生客户端 source**，且界面上就显示这个短名。
# - **路径说明符**（`./lib/opencode.js`）：走 `pathLike` 分支，向上找最近的 `package.json`
#   → 也产生 source，但**界面会显示成宿主改写后的绝对 `file:` URL**
#   （`anchorInsertedPluginNames` 把插入行的相对路径按「本 patch 所在目录」改写），
#   既长又暴露本机路径。**2026-10-28 起不再用这种写法。**
#
# **一个声明 `dsh.client` 的包只能有一个 source**：`reconcilePackage` 收齐所有
# `packageName` 相同的 source，`sources.length > 1` 时抛
# `client-modules: package ... resolves from multiple active Loader sources`
# （整个客户端启动失败）。所以三条**恰好一条**用裸包名，另两条用子路径写法。
#
# 裸包名解析到 `src/index.ts`（产物 `lib/index.js`），所以根入口**必须导出 `apply`**
# —— 它转发 `opencode` 那家的实现。这条是约定：谁用裸包名，谁就是默认入口。
#
# 值统一加引号：YAML 里以 `@`、`.` 或特殊字符开头的标量会被当成指示符而解析失败。
- insert:
    - id: llm-commandcode
      name: "dsh-llm-account/commandcode"
    - id: opencode-go
      name: "dsh-llm-account"
    - id: opendesign
      name: "dsh-llm-account/opendesign"
