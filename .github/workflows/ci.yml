# 最小 CI：构建 / 类型 / 测试 + 产物一致性 + 发布脚本的隔离 Git 测试。
#
# 为什么需要它（第六轮复审 V55-09）：此前所有「1535/1545 测试通过」都只是**提交说明
# 里的声明**，GitHub 上看不到任何独立证据。`lib/` 是本包必须提交的发布产物，没有
# 产物一致性检查时，源码与用户实际加载的 `lib/` 可能悄悄分叉。
#
# 约定：
# - 不使用任何真实凭据（`GITHUB_TOKEN` 只在发版脚本里读，CI 不涉及）；
# - 发布相关测试全在**临时 Git 仓库**里跑，不碰本仓库、不推远端；
# - 构建产物有 hash 文件名时，`git diff --exit-code` 可能因文件名变化而误报 ——
#   这里先验证「构建可重复」，再比对源码与产物。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 发布脚本的测试要建临时 git 仓库并跑 `git tag`/`git describe`，
          # 浅克隆会让这些命令行为不一致。
          fetch-depth: 0

      - name: 固定 Node 版本
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 启用 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装依赖（锁文件优先）
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm run typecheck

      - name: 测试
        run: pnpm test

      - name: 构建
        run: pnpm run build

      - name: 构建产物与仓库一致
        # `lib/` 是必须提交的发布产物。构建后若有差异，说明源码改了但产物没提交
        # （用户安装后跑的是旧产物）。这里允许「无差异」，不允许「有差异还继续」。
        run: |
          if [ -n "$(git status --porcelain -- lib)" ]; then
            echo "::error::lib/ 与源码不一致 —— 请本地跑 pnpm build 并提交产物"
            git status --porcelain -- lib
            git diff --stat -- lib
            exit 1
          fi
          echo "✓ lib/ 与源码一致"

      - name: 换行与提交标题规范
        run: |
          node scripts/check-final-newline.mjs
          node scripts/check-commit-titles.mjs --limit 5
