# 最小 CI：构建 / 类型 / 测试 + 产物一致性 + 发布脚本的隔离 Git 测试。
#
# 为什么需要它（第六轮复审 V55-09）：此前所有「1535/1545 测试通过」都只是**提交说明
# 里的声明**，GitHub 上看不到任何独立证据。`lib/` 是本包必须提交的发布产物，没有
# 产物一致性检查时，源码与用户实际加载的 `lib/` 可能悄悄分叉。
#
# 约定：
# - 不使用任何真实凭据（`GITHUB_TOKEN` 只在发版脚本里读，CI 不涉及）；
# - 发布相关测试全在**临时 Git 仓库**里跑，不碰本仓库、不推远端；
# - 构建产物有 hash 文件名时，`git diff --exit-code` 可能因文件名变化而误报 ——
#   这里先验证「构建可重复」，再比对源码与产物。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 发布脚本的测试要建临时 git 仓库并跑 `git tag`/`git describe`，
          # 浅克隆会让这些命令行为不一致。
          fetch-depth: 0

      - name: 固定 Node 版本
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # **不要在这里写 `version:`** —— `packageManager`（`pnpm@11.24.0`）已经是权威
      # 声明，两处同时指定会让 action 报：
      #
      #   Error: Multiple versions of pnpm specified
      #     - version pnpm@11.24.0 in the package.json with the key "packageManager"
      #
      # 省略 `version` 时 action 自动读 `packageManager`，版本只在一处维护。
      #
      # 历史：第一次加 CI 时写死 `version: 9`，而 lock 是 pnpm 11 生成的 → 三次运行
      # 全红；改成 11 之后又因与 `packageManager` 冲突继续红。
      - name: 启用 pnpm（版本取自 package.json 的 packageManager）
        uses: pnpm/action-setup@v4

      - name: 安装依赖（锁文件优先）
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm run typecheck

      - name: 测试
        run: pnpm test

      - name: 构建
        run: pnpm run build

      - name: 构建产物齐全且语法合法（不比对 hash）
        # `lib/` 是必须提交的发布产物，但**不能在这里做逐字节比对**：
        # tsdown 的 chunk 文件名含内容 hash，而 hash 与平台相关 —— 在 Linux 上重建
        # 会产出不同的 `<name>-<hash>.js`，`git status` 必然显示「删除旧 chunk +
        # 新增新 chunk」（2026-10-30 实测：`lib/node-BH9lUFMg.js` 被删、
        # `lib/index.js` 被改）。逐字节比对交给发版脚本（本机同平台）。
        #
        # ## 这里**不允许吞错**（第七轮复审 P2-C04）
        #
        # 上一版写成：
        #
        #     node --check "$f" 2>/dev/null || node -e "require('./$f')" 2>/dev/null || true
        #
        # `|| true` 让前面都失败时仍返回 0 —— 一个完全非法的 JS 文件也能通过，
        # 这步永远输出「✓ 产物齐全」。实测：往 `lib/bad.js` 写 `const = ;`，
        # 上面的命令退出码是 0。
        #
        # 现在 `set -euo pipefail` + 每个检查独立失败，任何一步非零就让 CI 变红。
        run: |
          set -euo pipefail
          for f in lib/index.js lib/commandcode.js lib/opencode.js lib/opendesign.js lib/client.js; do
            test -f "$f"
            node --check "$f"
            echo "  ✓ $f"
          done
          echo "✓ 构建产物齐全且语法合法"

      - name: 客户端产物的入口形状正确
        # `lib/client.js` 是**浏览器**包（第一行就 `window.__ModuleLoader__.load(...)`），
        # 在 Node 里 `import()` 会因 `window` 未定义而失败 —— 那不代表产物坏了。
        #
        # 这里只查它确实以 loader 调用开头（tsdown 的 banner 就是干这个的），
        # 若 banner 丢了，客户端插件在浏览器里根本不会注册。
        run: |
          set -euo pipefail
          head -c 200 lib/client.js | grep -q "__ModuleLoader__.load" \
            || { echo "::error::lib/client.js 缺少 __ModuleLoader__ banner"; exit 1; }
          echo "✓ lib/client.js 的 loader banner 在位"

      - name: 换行与提交标题规范
        run: |
          node scripts/check-final-newline.mjs
          node scripts/check-commit-titles.mjs --limit 5
